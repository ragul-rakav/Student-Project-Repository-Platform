<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectHub — Student Project Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-grad: linear-gradient(135deg, #0a0f24, #020617);
  --bg: #030712;
  --card: rgba(15, 23, 42, 0.65);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(99, 102, 241, 0.45);
  --text: #f8fafc;
  --muted: #94a3b8;
  --muted-2: #64748b;
  --accent: #6366f1;
  --accent-2: #8b5cf6;
  --accent-grad: linear-gradient(135deg, #6366f1, #8b5cf6);
  --teal-grad: linear-gradient(135deg, #06b6d4, #0db8a6);
  --green-grad: linear-gradient(135deg, #10b981, #059669);
  --red-grad: linear-gradient(135deg, #f43f5e, #e11d48);
  --gold-grad: linear-gradient(135deg, #fbbf24, #d97706);
  --silver-grad: linear-gradient(135deg, #cbd5e1, #64748b);
  --bronze-grad: linear-gradient(135deg, #d97706, #78350f);
  --gray-bg: rgba(255, 255, 255, 0.05);
  --radius: 16px;
  --radius-lg: 24px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  --glass: backdrop-filter: blur(14px) saturate(180%);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100vh;}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);
  background-image: radial-gradient(circle at 80% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 10% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 55%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.logo-text,.podium-name,.rank-pill,.stat-value,.credit-pill{font-family:'Outfit',sans-serif;font-weight:600;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:rgba(99, 102, 241, 0.3);color:#fff;}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: rgba(3, 7, 18, 0.5);
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.15);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.3);
}

/* ---------- Layout shells ---------- */
#app{min-height:100vh;}

.app-shell{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:260px;flex-shrink:0;background:rgba(3, 7, 18, 0.85);color:#cfd6ea;
  display:flex;flex-direction:column;padding:24px 16px;position:relative;
  border-right:1px solid var(--border);
  backdrop-filter:blur(20px);
  transition:width .3s cubic-bezier(0.4, 0, 0.2, 1), transform .3s ease;
}
.sidebar.collapsed{width:88px;}
.sidebar.collapsed .nav-label,.sidebar.collapsed .section-label,.sidebar.collapsed .brand-text,.sidebar.collapsed .signout-label{display:none;}
.brand-row{display:flex;align-items:center;gap:12px;padding:6px 8px 24px 8px;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;box-shadow:0 0 15px rgba(99, 102, 241, 0.45);}
.brand-text .brand{font-size:18px;font-weight:700;color:#fff;line-height:1.1;letter-spacing:-.01em;}
.brand-text .brand-sub{font-size:9px;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-top:2px;}

.nav-section{margin-top:16px;}
.section-label{font-size:10px;letter-spacing:.1em;color:var(--muted-2);font-weight:700;padding:0 12px 8px;text-transform:uppercase;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;
  font-size:14px;font-weight:500;color:var(--muted);margin-bottom:3px;white-space:nowrap;overflow:hidden;
  transition:all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  border:1px solid transparent;
}
.nav-item svg{flex-shrink:0;transition:transform 0.2s;}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.nav-item:hover svg{transform:translateX(2px);}
.nav-item.active{background:var(--accent-grad);color:#fff;box-shadow:0 4px 20px rgba(99, 102, 241, 0.35);border-color:rgba(255,255,255,0.1);}
.sidebar-spacer{flex:1;}
.signout{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--muted);font-size:14px;font-weight:500;transition:all 0.2s;}
.signout:hover{background:rgba(244,63,94,.1);color:#f43f5e;}

/* Main column */
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:70px;flex-shrink:0;background:rgba(3, 7, 18, 0.4);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:20;
  backdrop-filter:blur(16px);
}
.topbar-left{display:flex;align-items:center;gap:16px;}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--muted);
  display:flex;align-items:center;justify-content:center;transition:all 0.2s;
}
.icon-btn:hover{background:rgba(255,255,255,0.08);color:#fff;border-color:rgba(255,255,255,0.15);}
.crumb{font-size:15px;color:var(--muted);font-weight:500;}
.crumb b{color:#fff;font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.user-name{font-size:14.5px;font-weight:500;color:var(--text);}
.avatar{width:36px;height:36px;border-radius:10px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;box-shadow:0 4px 12px rgba(99, 102, 241, 0.25);}

.page{padding:32px 32px 60px;max-width:1280px;animation:fadein .4s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Page header */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap;}
.page-head h1{font-size:30px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(to right, #fff, #94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-head p{margin:0;color:var(--muted);font-size:15px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;font-size:14px;font-weight:600;padding:10px 18px;border:1px solid transparent;transition:all .25s cubic-bezier(0.4, 0, 0.2, 1);}
.btn-primary{background:var(--accent-grad);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,0.25);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(99,102,241,0.4);transform:translateY(-1px);}
.btn-outline{background:rgba(255,255,255,0.03);border-color:var(--border);color:#fff;}
.btn-outline:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);transform:translateY(-1px);}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:10px;}
.btn-danger-outline{background:rgba(244,63,94,0.05);border:1px solid rgba(244,63,94,0.2);color:#fb7185;}
.btn-danger-outline:hover{background:rgba(244,63,94,0.12);border-color:rgba(244,63,94,0.4);color:#fff;}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);backdrop-filter:blur(14px);transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px;}
.stat-card{padding:22px;border:1px solid rgba(255,255,255,0.05);}
.stat-card:hover{border-color:var(--border-hover);transform:translateY(-4px);box-shadow:0 12px 24px rgba(99,102,241,0.12);}
.stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.stat-top span{font-size:14px;color:var(--muted);font-weight:500;}
.stat-icon{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;color:var(--accent);}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(to right, #fff, #cbd5e1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-sub{font-size:13px;color:var(--muted-2);margin-top:6px;}
.stat-sub.up{color:#34d399;font-weight:600;}
.stat-sub .up-inline{color:#34d399;font-weight:600;}

/* badges */
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:3.5px 10px;border-radius:20px;border:1px solid transparent;}
.badge-gray{background:rgba(255,255,255,0.05);color:var(--muted);border-color:rgba(255,255,255,0.05);}
.badge-green{background:rgba(16,185,129,0.08);color:#34d399;border-color:rgba(16,185,129,0.15);}
.badge-blue{background:rgba(59,130,246,0.08);color:#60a5fa;border-color:rgba(59,130,246,0.15);}
.badge-amber{background:rgba(245,158,11,0.08);color:#fbbf24;border-color:rgba(245,158,11,0.15);}

/* project cards */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.proj-card{padding:22px;display:flex;flex-direction:column;gap:8px;cursor:pointer;}
.proj-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.proj-badges{display:flex;gap:6px;flex-wrap:wrap;}
.proj-cat{font-size:12.5px;color:var(--muted-2);white-space:nowrap;font-weight:600;}
.proj-title{font-size:17.5px;font-weight:600;margin:6px 0 0;line-height:1.3;color:#fff;letter-spacing:-.01em;}
.proj-by{font-size:13.5px;color:var(--muted);margin-top:2px;}
.proj-by b{color:#cbd5e1;font-weight:600;}
.proj-stats{display:flex;align-items:center;gap:18px;margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.05);font-size:13px;color:var(--muted-2);}
.proj-stats span{display:flex;align-items:center;gap:6px;}
.proj-stats button{background:none;border:none;display:flex;align-items:center;gap:6px;color:var(--muted-2);font-size:13px;padding:0;transition:all 0.2s;}
.proj-stats button:hover{color:#fb7185;}
.proj-stats button.liked{color:#fb7185;font-weight:600;}

/* filter tabs */
.tabs{display:inline-flex;background:rgba(3, 7, 18, 0.4);border:1px solid var(--border);border-radius:12px;padding:4px;gap:2px;}
.tab{padding:8px 16px;font-size:14px;font-weight:500;color:var(--muted);border-radius:10px;transition:all 0.2s;cursor:pointer;}
.tab:hover{color:#fff;}
.tab.active{background:var(--accent-grad);color:#fff;box-shadow:0 4px 12px rgba(99, 102, 241, 0.25);}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap;}
.search-wrap{position:relative;}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted-2);}
.search-input{padding:10px 14px 10px 38px;border:1px solid var(--border);background:rgba(15, 23, 42, 0.4);color:#fff;border-radius:12px;font-size:14px;width:260px;outline:none;transition:all 0.25s;}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(99, 102, 241, 0.2);}

/* leaderboard */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:28px;}
.podium-card{padding:30px 20px;text-align:center;position:relative;}
.podium-card.first{
  border-color:rgba(251, 191, 36, 0.5);
  box-shadow:0 0 25px rgba(251, 191, 36, 0.15), var(--shadow);
  transform:scale(1.03);
}
.podium-card.first:hover{
  border-color:rgba(251, 191, 36, 0.8);
  box-shadow:0 0 35px rgba(251, 191, 36, 0.25);
  transform:translateY(-4px) scale(1.03);
}
.rank-pill{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.04);color:#cbd5e1;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 16px;font-size:16px;border:1px solid var(--border);}
.rank-pill.gold{background:var(--gold-grad);color:#fff;box-shadow:0 0 15px rgba(251, 191, 36, 0.4);border-color:rgba(255,255,255,0.2);}
.rank-pill.silver{background:var(--silver-grad);color:#fff;box-shadow:0 0 15px rgba(100, 116, 139, 0.3);border-color:rgba(255,255,255,0.2);}
.rank-pill.bronze{background:var(--bronze-grad);color:#fff;box-shadow:0 0 15px rgba(217, 119, 6, 0.3);border-color:rgba(255,255,255,0.2);}
.avatar-lg{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--text);margin:0 auto 14px;font-size:18px;border:2px solid var(--border);}
.podium-name{font-weight:700;font-size:17px;color:#fff;}
.podium-meta{font-size:13px;color:var(--muted);margin:4px 0 16px;}
.podium-stats{display:flex;justify-content:center;gap:36px;}
.podium-stats div div:first-child{font-size:20px;font-weight:700;color:#fff;}
.podium-stats div div:last-child{font-size:10.5px;color:var(--muted-2);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:13px;padding:12px 14px;border-bottom:1px solid var(--border);}
td{padding:18px 14px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.01);}
.rank-num{font-weight:700;color:var(--muted-2);font-size:15px;}
.stu-row{display:flex;align-items:center;gap:12px;}
.avatar-sm{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;border:1px solid var(--border);}
.credit-pill{background:rgba(245,158,11,0.08);color:#fbbf24;font-weight:600;padding:4px 10px;border-radius:8px;font-size:13px;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(245,158,11,0.15);}

/* progress */
.progress-track{height:8px;background:rgba(255,255,255,0.05);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent-grad);border-radius:6px;box-shadow:0 0 10px rgba(99, 102, 241, 0.4);}

/* dashboard specific */
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:24px;}
.recent-card{padding:0;}
.notif-item{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.notif-item:last-child{border-bottom:none;}
.notif-icon{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent);border:1px solid var(--border);}
.notif-text{font-size:13.5px;color:#cbd5e1;line-height:1.4;}
.notif-time{font-size:11.5px;color:var(--muted-2);display:flex;align-items:center;gap:5px;margin-top:4px;}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.lb-row:last-child{border-bottom:none;}
.lb-badge{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,0.05);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#cbd5e1;border:1px solid var(--border);}
.lb-badge.gold{background:var(--gold-grad);color:#fff;border-color:rgba(255,255,255,0.1);box-shadow:0 0 8px rgba(251,191,36,0.3);}

/* modals */
.overlay{position:fixed;inset:0;background:rgba(2, 6, 23, 0.65);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;backdrop-filter:blur(8px);overflow-y:auto;}
.modal{margin:auto;background:rgba(15, 23, 42, 0.95);border:1px solid rgba(255,255,255,0.08);border-radius:20px;width:460px;max-width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 40px rgba(99, 102, 241, 0.1);backdrop-filter:blur(24px);animation:modalin 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);}
@keyframes modalin{from{opacity:0;transform:scale(0.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal h3{margin:0 0 6px;font-size:20px;color:#fff;font-weight:700;letter-spacing:-.01em;}
.modal p.hint{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;color:#cbd5e1;}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1px solid var(--border);background:rgba(3, 7, 18, 0.4);color:#fff;border-radius:10px;font-size:14.5px;font-family:inherit;outline:none;transition:all 0.25s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 10px rgba(99, 102, 241, 0.2);background:rgba(3, 7, 18, 0.6);}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px;}

/* toast */
.toast{position:fixed;bottom:28px;right:28px;background:var(--accent-grad);color:#fff;padding:14px 20px;border-radius:12px;font-size:14.5px;font-weight:600;box-shadow:0 15px 35px rgba(99,102,241,0.4);z-index:200;display:flex;align-items:center;gap:10px;animation:toastin .3s cubic-bezier(0.34, 1.56, 0.64, 1);}
@keyframes toastin{from{opacity:0;transform:translateY(15px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}

/* empty state */
.empty{padding:56px 20px;text-align:center;color:var(--muted-2);}
.empty svg{margin-bottom:12px;color:var(--muted-2);opacity:0.4;}

/* ============================= LANDING PAGE ============================= */
.landing-header{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:1px solid var(--border);background:rgba(3,7,18,0.4);backdrop-filter:blur(16px);position:sticky;top:0;z-index:20;}
.landing-nav{display:flex;gap:36px;font-size:14.5px;font-weight:500;color:var(--muted);transition:all 0.2s;}
.landing-nav a:hover{color:#fff;}
.landing-actions{display:flex;align-items:center;gap:24px;}
.landing-actions .signin{font-size:14.5px;font-weight:500;color:#cbd5e1;transition:all 0.2s;}
.landing-actions .signin:hover{color:#fff;}

.hero{max-width:1240px;margin:0 auto;padding:80px 48px 48px;display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(99, 102, 241, 0.2);background:rgba(99, 102, 241, 0.05);padding:6px 16px;border-radius:30px;font-size:13px;color:#818cf8;font-weight:600;margin-bottom:24px;}
.hero h1{font-size:52px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin:0 0 24px;background:linear-gradient(to right, #fff, #94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p.lead{font-size:16.5px;color:var(--muted);line-height:1.65;max-width:540px;margin:0 0 32px;}
.hero-cta{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap;}
.hero-check{display:flex;gap:24px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);}
.hero-check span{display:flex;align-items:center;gap:8px;}
.hero-art{background:var(--navy-grad);border-radius:24px;aspect-ratio:16/11.5;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,0.5);border:1px solid var(--border);}
.hero-art svg{width:78%;height:78%;}

.stats-strip{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:rgba(15,23,42,0.2);backdrop-filter:blur(10px);}
.stats-inner{max-width:1240px;margin:0 auto;padding:40px 48px;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;}
.stats-inner .num{font-size:32px;font-weight:800;letter-spacing:-.02em;color:#fff;}
.stats-inner .lab{font-size:13.5px;color:var(--muted);margin-top:6px;}

.feat-section{max-width:1240px;margin:0 auto;padding:90px 48px 48px;text-align:center;}
.feat-section h2{font-size:34px;margin:0 0 16px;font-weight:700;letter-spacing:-.02em;color:#fff;}
.feat-section > p{color:var(--muted);max-width:580px;margin:0 auto 48px;font-size:16px;}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;text-align:left;}
.feat-card{padding:28px;}

/* ============================= HELPERS ============================= */
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function badgeForType(type){
  if(type==='Internal') return `<span class="badge badge-gray">Internal</span>`;
  if(type==='External') return `<span class="badge badge-gray">External</span>`;
  if(type==='Enhancement') return `<span class="badge badge-blue">Enhancement</span>`;
  return `<span class="badge badge-amber">Idea</span>`;
}
function badgeForStatus(status){
  if(status==='Approved') return `<span class="badge badge-green">Approved</span>`;
  if(status==='In Review') return `<span class="badge badge-blue">In Review</span>`;
  if(status==='Pending Guide') return `<span class="badge badge-amber">Pending Guide</span>`;
  if(status==='Guide Declined') return `<span class="badge" style="background:rgba(244,63,94,0.12);color:#fb7185;border-color:rgba(244,63,94,0.25);">Guide Declined</span>`;
  return '';
}

function addNotification(emailOrRole, icon, text) {
  notifications.unshift({
    email: emailOrRole,
    icon: icon,
    text: text,
    time: 'Just now'
  });
}

function checkProjectAccess(p) {
  if(!CURRENT_USER) return true;
  if(CURRENT_USER.role !== 'Student') return true;
  if(p.author === CURRENT_USER.name) return true;
  if(p.collaborators && p.collaborators.includes(CURRENT_USER.name)) return true;
  
  if(CURRENT_USER.approvedProjects < 3) return false;
  
  // Find which tier matches project type
  let req = 0;
  if(p.type === 'Idea') req = ACCESS_TIERS[1].min;
  if(p.type === 'Internal') req = ACCESS_TIERS[2].min;
  if(p.type === 'External') req = ACCESS_TIERS[3].min;
  
  return CURRENT_USER.credits >= req;
}

function getCollaborationsForUser(username) {
  const list = [];
  projects.forEach(p => {
    if(p.author === username) {
      list.push({
        id: p.id,
        title: p.title,
        role: 'Owner',
        collaborators: p.collaborators || []
      });
    } else if(p.collaborators && p.collaborators.includes(username)) {
      list.push({
        id: p.id,
        title: p.title,
        role: 'Contributor',
        collaborators: [p.author + ' (owner)'].concat((p.collaborators || []).filter(c => c !== username))
      });
    }
  });
  return list;
}

function getLeaderboard(){
  const students = users.filter(u => u.role === 'Student');
  students.sort((a, b) => {
    if(b.credits !== a.credits) return b.credits - a.credits;
    return b.approvedProjects - a.approvedProjects;
  });
  return students.map((s, idx) => {
    return {
      rank: idx + 1,
      name: s.name,
      dept: s.dept,
      year: s.year,
      credits: s.credits,
      projects: s.approvedProjects,
      email: s.email
    };
  });
}

function accessTierInfo(credits){
  let current = ACCESS_TIERS[0], next = ACCESS_TIERS[1];
  for(let i=0;i<ACCESS_TIERS.length;i++){
    if(credits>=ACCESS_TIERS[i].min){ current = ACCESS_TIERS[i]; next = ACCESS_TIERS[i+1] || null; }
  }
  return {current, next};
}

function openProjectDetails(id){
  const p = projects.find(x=>x.id===id);
  if(p) {
    p.views += 1;
    setState({modal:'viewProject', viewProjectId:id});
  }
}

function showAccessLocked(type, id){
  let req = 60;
  if(type === 'Internal') req = ACCESS_TIERS[2].min;
  if(type === 'External') req = ACCESS_TIERS[3].min;
  setState({modal:'accessLocked', lockedTierName: type, lockedCreditsRequired: req});
}

function toggleLike(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  p.liked = !p.liked;
  const oldLikes = p.likes;
  p.likes += p.liked?1:-1;
  
  // Award credit check: every 10 likes = 1 credit to author
  const authorUser = users.find(u=>u.name===p.author);
  if(authorUser) {
    const oldLikeCredits = Math.floor(oldLikes / 10);
    const newLikeCredits = Math.floor(p.likes / 10);
    const diff = newLikeCredits - oldLikeCredits;
    if(diff !== 0) {
      authorUser.credits += diff;
      if(diff > 0) {
        addNotification(authorUser.email, 'award', `Your project "${p.title}" crossed ${newLikeCredits*10} likes! +1 credit points awarded.`);
      }
    }
  }
  render();
}

function authorCredits(name){
  const user = users.find(u=>u.name===name);
  return user ? user.credits : 0;
}

function requestAccessFormSubmit(e){
  e.preventDefault();
  const select = document.getElementById('collab-proj-select');
  const projId = parseInt(select.value);
  if(isNaN(projId)) return false;
  requestAccessForProject(projId);
  select.value = '';
  return false;
}

function requestAccessForProject(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  const exists = collaborationRequests.some(r => r.projectId === id && r.requester === CURRENT_USER.name && r.status === 'Pending');
  if(exists){
    showToast("Collaboration request already pending!");
    return;
  }
  collaborationRequests.unshift({
    id: nextCollabRequestId++,
    projectId: id,
    projectTitle: p.title,
    requester: CURRENT_USER.name,
    owner: p.author,
    status: 'Pending'
  });
  
  const ownerUser = users.find(u=>u.name===p.author);
  if(ownerUser) {
    addNotification(ownerUser.email, 'users', `${CURRENT_USER.name} requested to collaborate on your project "${p.title}"`);
  }
  showToast("Collaboration request sent!");
  render();
}

function handleCollaborationRequest(reqId, accept){
  const req = collaborationRequests.find(r=>r.id===reqId);
  if(!req) return;
  req.status = accept ? 'Accepted' : 'Declined';
  
  const p = projects.find(x=>x.id===req.projectId);
  if(p){
    if(accept){
      p.collaborators = p.collaborators || [];
      if(!p.collaborators.includes(req.requester)){
        p.collaborators.push(req.requester);
      }
      const reqUser = users.find(u=>u.name===req.requester);
      if(reqUser) {
        addNotification(reqUser.email, 'users', `${req.owner} accepted your collaboration request for "${p.title}"`);
      }
      showToast(`Accepted ${req.requester} as contributor`);
    } else {
      const reqUser = users.find(u=>u.name===req.requester);
      if(reqUser) {
        addNotification(reqUser.email, 'x', `${req.owner} declined your collaboration request for "${p.title}"`);
      }
      showToast(`Declined collaboration request`);
    }
  }
  render();
}

function reviewAction(id, approve){
  const r = reviewQueue.find(x=>x.id===id);
  if(!r) return;
  reviewQueue = reviewQueue.filter(x=>x.id!==id);
  
  const authorUser = users.find(u=>u.name===r.author);
  
  if(r.isEnhancement){
    const proj = projects.find(p=>p.id===r.projectId);
    if(approve){
      if(proj){
        proj.enhancements = proj.enhancements || [];
        proj.enhancements.push({
          title: r.enhancementTitle,
          details: r.details,
          author: r.author
        });
        
        const ownerUser = users.find(u=>u.name===proj.author);
        if(ownerUser){
          ownerUser.credits += 10;
          addNotification(ownerUser.email, 'award', `Your project "${proj.title}" was enhanced by ${r.author}. +10 credits awarded.`);
        }
        if(authorUser){
          authorUser.credits += 10;
          addNotification(authorUser.email, 'award', `Your enhancement on "${proj.title}" was approved. +10 credits awarded.`);
        }
        showToast(`Enhancement approved! +10 credits awarded`);
      }
    } else {
      if(authorUser){
        addNotification(authorUser.email, 'x', `Your enhancement on "${proj ? proj.title : ''}" was rejected.`);
      }
      showToast("Enhancement rejected.");
    }
  } else {
    const proj = projects.find(p=>p.id===id);
    const credits = (r.type==='External') ? 20 : 10;
    if(approve){
      if(proj) proj.status = 'Approved';
      if(authorUser){
        authorUser.credits += credits;
        authorUser.approvedProjects += 1;
        addNotification(authorUser.email, 'star', `Your project "${r.title}" was approved! +${credits} credits awarded.`);
      }
      showToast(`${r.title} approved — +${credits} credits awarded to ${r.author}`);
    } else {
      if(proj) projects = projects.filter(p=>p.id!==id);
      if(authorUser){
        addNotification(authorUser.email, 'x', `Your project "${r.title}" was rejected and sent back for changes.`);
      }
      showToast(`${r.title} sent back for changes`);
    }
  }
  render();
}

  return `
    <div class="page-head">
      <div><h1>Guide Requests</h1><p>Students requesting your mentorship on external projects.</p></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;border:1px solid rgba(255,255,255,0.05);">
      ${myGuideReqs.length? `<table>
        <tr><th>Student</th><th>Project</th><th>Requested</th><th></th></tr>
        ${myGuideReqs.map(g=>`
          <tr>
            <td style="font-weight:600;color:#fff;"><span class="clickable-name" onclick="viewStudentProfile('${g.student}')">${g.student}</span></td>
            <td style="color:var(--muted);">${g.project}</td>
            <td style="color:var(--muted);">${g.requested}</td>
            <td style="display:flex;gap:8px;">
              <button class="btn btn-primary btn-sm" onclick="guideAction(${g.id},true)">Accept</button>
              <button class="btn btn-danger-outline btn-sm" onclick="guideAction(${g.id},false)">Decline</button>
            </td>
          </tr>
        `).join('')}
      </table>` : emptyState('No pending guide requests.', 'chat')}
    </div>
  `;
}
function guideAction(id, accept){
  const g = guideRequests.find(x=>x.id===id);
  if(!g) return;
  guideRequests = guideRequests.filter(x=>x.id!==id);
  const proj = projects.find(p=>p.id===id);
  
  const studentUser = users.find(u=>u.name===g.student);
  
  if(accept){
    if(proj) proj.status = 'In Review';
    reviewQueue.unshift({id, title:g.project, author:g.student, category:g.category||'General', submitted:'Just now', type:'External', faculty:g.faculty});
    if(studentUser) {
      addNotification(studentUser.email, 'bell', `${g.faculty} accepted your guide request for "${g.project}"`);
    }
    showToast(`You accepted ${g.student}'s guide request`);
  } else {
    if(proj) proj.status = 'Guide Declined';
    if(studentUser) {
      addNotification(studentUser.email, 'x', `${g.faculty} declined your guide request for "${g.project}"`);
    }
    showToast(`Request from ${g.student} declined`);
  }
  render();
}

function submitProjectForm(e){
  e.preventDefault();
  const title = document.getElementById('f-title').value;
  const cat = document.getElementById('f-cat').value;
  const techVal = document.getElementById('f-tech').value;
  const abstract = document.getElementById('f-abstract').value;
  const github = document.getElementById('f-github').value;
  const doc = document.getElementById('f-doc').value;
  const type = state.submitType;
  const id = nextProjectId++;
  const tech = techVal.split(',').map(t=>t.trim()).filter(t=>t.length > 0);
  
  const ppt = state.submitType==='Internal' ? document.getElementById('f-ppt').value : '';
  const cert = state.submitType==='External' ? document.getElementById('f-cert').value : '';
  const demo = document.getElementById('f-demo').value;
  const vercel = document.getElementById('f-vercel').value;

  if(type==='Internal'){
    const faculty = document.getElementById('f-faculty').value;
    projects.unshift({id, type:'Internal', status:'In Review', title, author:CURRENT_USER.name, dept:CURRENT_USER.dept, category:cat, likes:0, commentsCount:0, views:0, liked:false, abstract, github, doc, ppt, demo, vercel, tech, collaborators:[], comments:[]});
    reviewQueue.unshift({id, title, author:CURRENT_USER.name, category:cat, submitted:'Just now', type:'Internal', faculty:faculty});
    
    addNotification(faculty, 'bell', `New Internal Project submitted: "${title}" by ${CURRENT_USER.name}`);
    addNotification('Administrator', 'folder', `New project submitted: "${title}" by ${CURRENT_USER.name}`);
    
    setState({modal:null, page:'projects'});
    showToast(`Submitted — sent to ${faculty} for review`);
  } else {
    const faculty = document.getElementById('f-faculty').value;
    projects.unshift({id, type:'External', status:'Pending Guide', title, author:CURRENT_USER.name, dept:CURRENT_USER.dept, category:cat, likes:0, commentsCount:0, views:0, liked:false, abstract, github, doc, cert, demo, vercel, tech, collaborators:[], comments:[]});
    guideRequests.unshift({id, student:CURRENT_USER.name, project:title, faculty, category:cat, requested:'Just now'});
    
    addNotification(faculty, 'chat', `${CURRENT_USER.name} requested you as guide for external project "${title}"`);
    
    setState({modal:null, page:'projects'});
    showToast(`Guide request sent to ${faculty}`);
  }
  return false;
}

function publishIdeaForm(e){
  e.preventDefault();
  const title = document.getElementById('f-ititle').value;
  const cat = document.getElementById('f-icat').value;
  const techVal = document.getElementById('f-itech').value;
  const desc = document.getElementById('f-idesc').value;
  const tech = techVal.split(',').map(t=>t.trim()).filter(t=>t.length > 0);
  
  projects.unshift({id:nextProjectId++, type:'Idea', status:null, title, author:CURRENT_USER.name, dept:CURRENT_USER.dept, category:cat, likes:0, commentsCount:0, views:0, liked:false, description:desc, tech, collaborators:[], comments:[]});
  
  CURRENT_USER.credits += 5;
  addNotification(CURRENT_USER.email, 'award', `Published Idea "${title}". +5 credits earned.`);
  addNotification('Administrator', 'bell', `New Idea published: "${title}" by ${CURRENT_USER.name}`);
  
  setState({modal:null, page:'ideas'});
  showToast('Idea published — +5 credits earned');
  return false;
}

function addUserForm(e){
  e.preventDefault();
  const name = document.getElementById('f-uname').value;
  const email = document.getElementById('f-uemail').value;
  const role = document.getElementById('f-urole').value;
  
  users.push({
    name, email, role, status:'Active',
    dept: role==='Student' ? 'Computer Science' : role==='Faculty' ? 'Computer Science' : 'Platform Admin',
    year: role==='Student' ? 'Third Year' : '—',
    credits: 0, approvedProjects: 0, skills: [], domainOfInterest: ''
  });
  
  addNotification('Administrator', 'users', `Added user: ${name} as ${role}`);
  setState({modal:null});
  showToast(`${name} added as ${role}`);
  return false;
}

function postCommentForm(event, id){
  event.preventDefault();
  const textarea = document.getElementById('comment-text-input');
  const text = textarea.value.trim();
  if(!text) return false;
  
  const p = projects.find(x=>x.id===id);
  if(p){
    p.comments = p.comments || [];
    p.comments.push({
      author: CURRENT_USER.name,
      text: text,
      time: 'Just now'
    });
    p.commentsCount = p.comments.length;
    textarea.value = '';
    
    if(p.author !== CURRENT_USER.name) {
      const authorUser = users.find(u=>u.name === p.author);
      if(authorUser) {
        addNotification(authorUser.email, 'chat', `${CURRENT_USER.name} commented on your project "${p.title}"`);
      }
    }
  }
  render();
  return false;
}

function reportProject(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  if(confirm(`Are you sure you want to report "${p.title}" for guidelines violation?`)){
    addNotification('Administrator', 'bell', `Project "${p.title}" reported by ${CURRENT_USER.name}`);
    showToast("Project reported to administrator.");
    setState({modal:null});
  }
}

function submitEnhancementForm(e){
  e.preventDefault();
  const projId = parseInt(document.getElementById('f-eh-projid').value);
  const title = document.getElementById('f-eh-title').value;
  const details = document.getElementById('f-eh-details').value;
  const link = document.getElementById('f-eh-link').value;
  
  const proj = projects.find(p=>p.id===projId);
  if(!proj) return false;
  
  const id = nextProjectId++;
  reviewQueue.unshift({
    id,
    isEnhancement: true,
    projectId: projId,
    projectTitle: proj.title,
    enhancementTitle: title,
    details: details,
    codeLink: link,
    author: CURRENT_USER.name,
    category: proj.category,
    submitted: 'Just now',
    type: 'Enhancement',
    faculty: facultyList[0] // Faculty assigned
  });
  
  addNotification(facultyList[0], 'bell', `Enhancement review requested for project "${proj.title}" by ${CURRENT_USER.name}`);
  addNotification('Administrator', 'bell', `Enhancement submitted for project "${proj.title}" by ${CURRENT_USER.name}`);
  
  setState({modal:null});
  showToast("Enhancement submitted for faculty review");
  return false;
}

  const dept = document.getElementById('reg-dept').value;
  const year = document.getElementById('reg-year').value;
  
  const exists = users.some(u => u.email.toLowerCase() === email.toLowerCase());

    return false;
  }
  
  const newUser = {

    role: 'Student',

  addNotification('Administrator', 'users', `New student registered: ${name}`);

          <form onsubmit="return loginSubmit(event)">
            <div class="field"><label>Email</label><input required type="email" id="f-email" placeholder="${state.loginRole==='Faculty'?'sarah.smith@university.edu':state.loginRole==='Administrator'?'admin@university.edu':'alex@university.edu'}" value="${state.loginRole==='Faculty'?'sarah.smith@university.edu':state.loginRole==='Administrator'?'admin@university.edu':'alex@university.edu'}"/></div>
            <div class="field"><label>Password</label><input required type="password" id="f-pass" value="password" placeholder="••••••••"/></div>
            <div class="login-actions-row">
              <label style="display:flex;align-items:center;gap:6px;color:var(--muted);"><input type="checkbox" style="width:auto;"/> Remember me</label>
              <a onclick="showToast('Password reset link sent')">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">Continue as ${state.loginRole} ${icon('arrow',15)}</button>
          </form>
          <div class="demo-hint">${icon('shield',14)} No backend yet — any password works. Pick a role above or use one of the pre-loaded profiles.</div>
          <div class="login-switch">New to ProjectHub? <a onclick="setState({loginScreen:'register'})">Register here</a></div>
        </div>
      </div>
    </div>
  `;
}

function loginSubmit(e){
  e.preventDefault();
  const email = document.getElementById('f-email').value.trim();
  let user = users.find(u=>u.email.toLowerCase() === email.toLowerCase());
  if(!user){
    const profile = ROLE_PROFILES[state.loginRole] || { name: 'Faculty Member', role: state.loginRole, dept: 'Computer Science' };
    user = Object.assign({}, profile, { email, role: state.loginRole, status:'Active', skills: [], domainOfInterest: '' });
    users.push(user);
  } else {
    user.role = state.loginRole;
  }
  user.initials = initials(user.name);
  CURRENT_USER = user;
  setState({authed:true, page:'dashboard'});
  showToast(`Welcome back, ${CURRENT_USER.name} (${CURRENT_USER.role})`);
  return false;
}

function logout(){
  CURRENT_USER = null;
  setState({authed:false, page:'login'});
}

/* ============================= ROOT RENDER ============================= */
function render(){
  let html;
  if(state.page==='landing'){
    html = pageLanding();
  } else if(state.page==='login'){
    html = pageLogin();
  } else if(!CURRENT_USER){
    state.page = 'login';
    html = pageLogin();
  } else {
    let inner;
    switch(state.page){
      case 'dashboard': inner = pageDashboard(); break;
      case 'projects': inner = pageProjects(); break;
      case 'ideas': inner = pageIdeas(); break;
      case 'collaboration': inner = pageCollaboration(); break;
      case 'leaderboard': inner = pageLeaderboard(); break;
      case 'reviews': inner = pageReviews(); break;
      case 'guides': inner = pageGuides(); break;
      case 'analytics': inner = pageAnalytics(); break;
      case 'users': inner = pageUsers(); break;
      case 'profile': inner = pageProfile(); break;
      default: inner = pageDashboard();
    }
    html = renderShell(inner);
  }
  html += renderModal();
  if(state.toast) html += `<div class="toast">${icon('check',16)} ${state.toast}</div>`;
  document.getElementById('app').innerHTML = html;
}
render();
</script>
</body>
</html>
